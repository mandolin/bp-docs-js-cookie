name: HIA Documentation Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hia-documentation-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build matrix and public default Portal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      # 中文：所有 checkout 均固定 ref 且不保留凭据；BP 需要完整历史验证 upstream baseline。
      # English: Every checkout pins a ref and drops credentials; the BP needs full history to verify its upstream baseline.
      - name: Check out bp-docs-js-cookie
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out JSDoc plugin owner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mandolin/jsdoc-plugin-hia-sys
          ref: 15970dc9da0f8e120677eab7eba3e959dcf42a34
          path: .hia-docs-owners/HIA/jsdoc-plugin-hia-sys
          persist-credentials: false

      - name: Check out JSDoc theme owner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mandolin/jsdoc-theme-hia
          ref: 0df2ca9bbf40e159d8da69aac80b3c31136b1a05
          path: .hia-docs-owners/HIA/jsdoc-theme-hia
          persist-credentials: false

      - name: Check out hia-jsdoc owner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mandolin/hia-jsdoc
          ref: 4890e0bf1b943a14cf247f9b413d140a43a6bb5b
          path: .hia-docs-owners/HIA/hia-jsdoc
          persist-credentials: false

      - name: Check out HIA Portal owner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mandolin/HIA-Documentation
          ref: b13203038ebcad604904575a70055d89d6027c50
          path: .hia-docs-owners/main-repo
          persist-credentials: false

      # 中文：mise 是唯一工具版本入口，不复用 runner 浮动 Node/pnpm。
      # English: mise is the sole tool-version entry point; runner-floating Node/pnpm are not reused.
      - name: Install pinned toolchain with mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Install pinned documentation runtime
        working-directory: tools/hia-docs/runtime
        run: mise exec node@24.22.1 -- npm ci --ignore-scripts --no-audit --no-fund

      # 中文：新版聚合工具的冻结锁引用相邻owner归档，先核精确来源并生成缓存，再执行普通冻结安装。
      # English: The current umbrella lock references sibling-owner archives; verify exact sources and prepare caches before the ordinary frozen installation.
      - name: Prepare pinned hia-jsdoc owner archives
        working-directory: .hia-docs-owners/HIA/hia-jsdoc
        run: mise exec node@24.22.1 -- npm run prepare:owners

      - name: Install hia-jsdoc owner dependencies
        working-directory: .hia-docs-owners/HIA/hia-jsdoc
        run: mise exec node@24.22.1 -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Install HIA Portal owner dependencies
        run: mise exec node@24.22.1 pnpm@10.34.4 -- pnpm --dir .hia-docs-owners/main-repo install --frozen-lockfile

      # 中文：先由 Node 22 构建并暂存矩阵与公开产品的 body-free 指纹，再由 Node 24 重建与验收；最终只上传 Node 24 public artifact。
      # English: Build under Node 22 and stage body-free fingerprints for both the matrix and public product, then rebuild and verify under Node 24; upload only the final Node 24 public artifact.
      - name: Build Node 22 determinism baseline
        env:
          HIA_DOCS_OWNER_ROOT: ${{ github.workspace }}/.hia-docs-owners
        run: |
          mise exec node@22.23.4 -- node tools/hia-docs/build.mjs
          cp build/hia-docs/evidence/showcase-fingerprint.json "${RUNNER_TEMP}/hia-docs-node22-fingerprint.json"
          cp build/hia-docs/evidence/public-fingerprint.json "${RUNNER_TEMP}/hia-docs-node22-public-fingerprint.json"

      - name: Build and verify matrix and public product
        env:
          HIA_DOCS_OWNER_ROOT: ${{ github.workspace }}/.hia-docs-owners
        run: |
          mise exec node@24.22.1 -- node tools/hia-docs/build.mjs
          mise exec node@24.22.1 -- node --test tools/hia-docs/public-artifact.test.mjs tools/hia-docs/showcase.test.mjs tools/hia-docs/sanitize.test.mjs
          mise exec node@24.22.1 -- node tools/hia-docs/check.mjs
          mise exec node@24.22.1 -- node tools/hia-docs/check-determinism.mjs "${RUNNER_TEMP}/hia-docs-node22-fingerprint.json" "${RUNNER_TEMP}/hia-docs-node22-public-fingerprint.json"
          mise exec node@24.22.1 -- node tools/hia-docs/check-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload default-Portal-only Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/hia-docs/public

  deploy:
    name: Deploy public Portal
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
